{{extend 'layout.html'}}
<h2>Web Service CAR CRUDS (Web2py)</h2>

<form method="get" action="{{=URL('index')}}" style="margin-bottom: 15px;">
    <input type="text" name="keyword" value="{{=keyword}}" placeholder="Cari nama, merek, model, harga..." style="padding: 5px; width: 260px;">
    <button type="submit">Search</button>
    <a href="{{=URL('index')}}">Reset</a> | 
    <a href="{{=URL('create')}}">+ Tambah Data Mobil</a>
</form>

<table class="table table-bordered">
    <thead>
        <tr>
            <th>ID</th>
            <th>Car Name</th>
            <th>Car Brand</th>
            <th>Car Model</th>
            <th>Car Price</th>
            <th>Aksi</th>
        </tr>
    </thead>
    <tbody>
        {{for car in cars:}}
        <tr>
            <td>{{=car['id']}}</td>
            <td>{{=car['carname']}}</td>
            <td>{{=car['carbrand']}}</td>
            <td>{{=car['carmodel']}}</td>
            <td>{{=car['carprice']}}</td>
            <td>
                <a href="{{=URL('update', args=[car['id']])}}">Update</a> | 
                <a href="{{=URL('delete', args=[car['id']])}}" onclick="return confirm('Yakin hapus data ini?')">Delete</a>
            </td>
        </tr>
        {{pass}}
    </tbody>
</table>
